services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: actledger-server:local
    command: ["serve", "--host", "0.0.0.0", "--port", "4400", "--trust-proxy", "--public-url", "https://${DOMAIN:?set DOMAIN in deploy/.env}"]
    volumes: ["actledger-data:/data"]
    expose: ["4400"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment: { DOMAIN: "${DOMAIN}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: { server: { condition: service_healthy } }
    restart: unless-stopped
volumes: { actledger-data: {}, caddy-data: {}, caddy-config: {} }
